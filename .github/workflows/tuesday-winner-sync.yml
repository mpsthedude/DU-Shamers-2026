name: Sync DU Shamers weekly high scorer

on:
  schedule:
    # GitHub cron is UTC. We run at both possible UTC equivalents of 9 AM ET.
    # The Edge Function itself checks America/New_York and only performs the
    # ESPN sync when the local hour is actually 9, covering DST automatically.
    - cron: "5 13 * * 2"
    - cron: "5 14 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync completed ESPN scoring week
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --header 'apikey: sb_publishable_oTJVPjW_EdOokBZfTSJKaA_GuUwJjOF' \
            --header 'Authorization: Bearer sb_publishable_oTJVPjW_EdOokBZfTSJKaA_GuUwJjOF' \
            --data '{"scheduled":true}' \
            'https://xvnkwtiydyrksucgiphi.supabase.co/functions/v1/sync-weekly-winner'
