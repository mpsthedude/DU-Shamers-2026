name: Sync DU Shamers weekly high scorer

on:
  # Production scheduling lives in Supabase Cron (8 AM America/Chicago).
  # Retained for manual diagnostics within the scheduled window.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync completed ESPN scoring week
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --header 'apikey: sb_publishable_oTJVPjW_EdOokBZfTSJKaA_GuUwJjOF' \
            --header 'Authorization: Bearer sb_publishable_oTJVPjW_EdOokBZfTSJKaA_GuUwJjOF' \
            --data '{"scheduled":true}' \
            'https://xvnkwtiydyrksucgiphi.supabase.co/functions/v1/sync-weekly-winner'
